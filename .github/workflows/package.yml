name: Build team package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: MCP server tests
        working-directory: mcp-server
        shell: pwsh
        # On failure the last lines also become annotations, readable through the API without the full log.
        run: |
          npm ci 2>&1 | Tee-Object -FilePath ci.log
          if ($LASTEXITCODE -eq 0) { npm run check 2>&1 | Tee-Object -FilePath ci.log -Append }
          if ($LASTEXITCODE -ne 0) { Get-Content ci.log -Tail 40 | ForEach-Object { "::error::$_" }; exit 1 }
      - name: Build package
        shell: pwsh
        run: ./build-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ACE-RevitMCP-package
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
